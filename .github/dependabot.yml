version: 2
updates:
  # The actions the workflows pin by commit SHA. A release is proposed once it
  # is 3 days old, the delay the images get on the hosts, and merge-dependabot.yml
  # merges the pull request once the image builds and passes its tests.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    commit-message:
      prefix: ":arrow_up:"
    labels:
      - "kind/dependencies"
      - "bot"
