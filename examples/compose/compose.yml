name: msmtpd

services:
  msmtpd:
    image: ghcr.io/striffly/docker-msmtpd:master
    container_name: msmtpd
    # No published port: other containers on this network send to msmtpd:2500.
    environment:
      - "TZ=Europe/Paris"
      - "SMTP_HOST=smtp.gmail.com"
      - "SMTP_PORT=587"
      - "SMTP_SECURITY=starttls"
      - "SMTP_USER_FILE=/run/secrets/smtp_user"
      - "SMTP_PASSWORD_FILE=/run/secrets/smtp_password"
      - "SMTP_FROM=foo@example.com"
    secrets:
      - smtp_user
      - smtp_password
    restart: always

secrets:
  smtp_user:
    file: ./smtp_user
  smtp_password:
    file: ./smtp_password
